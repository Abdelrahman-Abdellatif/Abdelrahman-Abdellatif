<svg xmlns="http://www.w3.org/2000/svg" width="900" height="438" viewBox="0 0 900 438" role="img" aria-label="Animated Linux terminal showing Abdelrahman Abdellatif's skills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B0F2E"/>
      <stop offset="1" stop-color="#2B0A22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4A48"/>
      <stop offset="1" stop-color="#2F2F2D"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="win"><rect x="8" y="8" width="884" height="422" rx="10"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="8" y="8" width="884" height="422" rx="10" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#win)">
    <rect x="8" y="8" width="884" height="38" fill="url(#bar)"/>
    <rect x="8" y="46" width="884" height="1" fill="#1a1a1a"/>
  </g>

  <!-- Ubuntu-style window buttons (right) -->
  <g>
    <circle cx="830" cy="27" r="9" fill="#595959"/>
    <circle cx="854" cy="27" r="9" fill="#595959"/>
    <circle cx="876" cy="27" r="9" fill="#E95420"/>
    <path d="M826 27h8" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="850" y="23" width="8" height="8" fill="none" stroke="#fff" stroke-width="1.5"/>
    <path d="M872 23l8 8M880 23l-8 8" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <text x="450.0" y="32" text-anchor="middle" font-family="'Ubuntu Mono','DejaVu Sans Mono','Fira Code',Menlo,Consolas,monospace" font-size="14" fill="#DFDBD2">abdelrahman@vilnius-tech: ~</text>

  <g font-family="'Ubuntu Mono','DejaVu Sans Mono','Fira Code',Menlo,Consolas,monospace" font-size="14" xml:space="preserve">
        <text x="28" y="74" opacity="0"><tspan fill="#8AE234" font-weight="bold">abdelrahman@vilnius-tech</tspan><tspan fill="#FFFFFF">:</tspan><tspan fill="#729FCF" font-weight="bold">~</tspan><tspan fill="#FFFFFF">$ </tspan><set attributeName="opacity" to="1" begin="0.60s" fill="freeze"/></text>
    <clipPath id="c0"><rect x="264.0" y="58" width="0" height="22"><animate attributeName="width" calcMode="discrete" values="0.0;8.4;16.9;25.3;33.7;42.1;50.6" begin="0.80s" dur="0.42s" fill="freeze"/></rect></clipPath>
    <text x="264.0" y="74" fill="#FFFFFF" clip-path="url(#c0)">whoami</text>
    <text x="28" y="96" fill="#FFFFFF" opacity="0" xml:space="preserve">Abdelrahman Abdellatif  ::  Linux Engineer<set attributeName="opacity" to="1" begin="1.57s" fill="freeze"/></text>
    <text x="28" y="118" opacity="0"><tspan fill="#8AE234" font-weight="bold">abdelrahman@vilnius-tech</tspan><tspan fill="#FFFFFF">:</tspan><tspan fill="#729FCF" font-weight="bold">~</tspan><tspan fill="#FFFFFF">$ </tspan><set attributeName="opacity" to="1" begin="2.10s" fill="freeze"/></text>
    <clipPath id="c2"><rect x="264.0" y="102" width="0" height="22"><animate attributeName="width" calcMode="discrete" values="0.0;8.4;16.9;25.3;33.7;42.1;50.6;59.0;67.4" begin="2.30s" dur="0.56s" fill="freeze"/></rect></clipPath>
    <text x="264.0" y="118" fill="#FFFFFF" clip-path="url(#c2)">uname -a</text>
    <text x="28" y="140" fill="#D3D7CF" opacity="0" xml:space="preserve">Linux yocto-dev 6.x-custom #1 SMP PREEMPT armv7l GNU/Linux<set attributeName="opacity" to="1" begin="3.21s" fill="freeze"/></text>
    <text x="28" y="162" opacity="0"><tspan fill="#8AE234" font-weight="bold">abdelrahman@vilnius-tech</tspan><tspan fill="#FFFFFF">:</tspan><tspan fill="#729FCF" font-weight="bold">~</tspan><tspan fill="#FFFFFF">$ </tspan><set attributeName="opacity" to="1" begin="3.74s" fill="freeze"/></text>
    <clipPath id="c4"><rect x="264.0" y="146" width="0" height="22"><animate attributeName="width" calcMode="discrete" values="0.0;8.4;16.9;25.3;33.7;42.1;50.6;59.0;67.4;75.9;84.3;92.7;101.2;109.6;118.0;126.4;134.9;143.3" begin="3.94s" dur="1.19s" fill="freeze"/></rect></clipPath>
    <text x="264.0" y="162" fill="#FFFFFF" clip-path="url(#c4)">cat ~/skills.conf</text>
    <text x="28" y="184" fill="#8AE234" opacity="0" xml:space="preserve">CONFIG_EMBEDDED_LINUX=y      # BSPs, rootfs, boards<set attributeName="opacity" to="1" begin="5.48s" fill="freeze"/></text>
    <text x="28" y="206" fill="#8AE234" opacity="0" xml:space="preserve">CONFIG_KERNEL=y              # drivers, device tree, debugging<set attributeName="opacity" to="1" begin="5.66s" fill="freeze"/></text>
    <text x="28" y="228" fill="#8AE234" opacity="0" xml:space="preserve">CONFIG_BOOTLOADER=y          # U-Boot, boot chain bring-up<set attributeName="opacity" to="1" begin="5.84s" fill="freeze"/></text>
    <text x="28" y="250" fill="#8AE234" opacity="0" xml:space="preserve">CONFIG_STM32_BAREMETAL=y     # registers, no OS, no excuses<set attributeName="opacity" to="1" begin="6.02s" fill="freeze"/></text>
    <text x="28" y="272" fill="#8AE234" opacity="0" xml:space="preserve">CONFIG_YOCTO=y               # custom distros, layers, recipes<set attributeName="opacity" to="1" begin="6.20s" fill="freeze"/></text>
    <text x="28" y="294" fill="#8AE234" opacity="0" xml:space="preserve">CONFIG_ROBOTICS=y            # hardware that moves<set attributeName="opacity" to="1" begin="6.38s" fill="freeze"/></text>
    <text x="28" y="316" opacity="0"><tspan fill="#8AE234" font-weight="bold">abdelrahman@vilnius-tech</tspan><tspan fill="#FFFFFF">:</tspan><tspan fill="#729FCF" font-weight="bold">~</tspan><tspan fill="#FFFFFF">$ </tspan><set attributeName="opacity" to="1" begin="6.91s" fill="freeze"/></text>
    <clipPath id="c11"><rect x="264.0" y="300" width="0" height="22"><animate attributeName="width" calcMode="discrete" values="0.0;8.4;16.9;25.3;33.7;42.1;50.6;59.0;67.4;75.9;84.3;92.7;101.2;109.6;118.0;126.4;134.9;143.3" begin="7.11s" dur="1.19s" fill="freeze"/></rect></clipPath>
    <text x="264.0" y="316" fill="#FFFFFF" clip-path="url(#c11)">dmesg | tail -n 2</text>
    <text x="28" y="338" fill="#FCE94F" opacity="0" xml:space="preserve">[    0.000000] Booting Linux on things it's never met before...<set attributeName="opacity" to="1" begin="8.65s" fill="freeze"/></text>
    <text x="28" y="360" fill="#8AE234" opacity="0" xml:space="preserve">[  OK  ] Reached target Computer Engineer @ VILNIUS TECH<set attributeName="opacity" to="1" begin="8.83s" fill="freeze"/></text>
    <text x="28" y="382" opacity="0"><tspan fill="#8AE234" font-weight="bold">abdelrahman@vilnius-tech</tspan><tspan fill="#FFFFFF">:</tspan><tspan fill="#729FCF" font-weight="bold">~</tspan><tspan fill="#FFFFFF">$ </tspan><set attributeName="opacity" to="1" begin="9.36s" fill="freeze"/></text>
    <rect x="264.0" y="368" width="9" height="18" fill="#FFFFFF" opacity="0"><set attributeName="opacity" to="1" begin="9.36s"/><animate attributeName="opacity" values="1;1;0;0" dur="1.1s" begin="9.36s" repeatCount="indefinite"/></rect>
  </g>
</svg>
